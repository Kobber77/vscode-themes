<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background: silent-night navy -->
  <rect width="128" height="128" rx="16" fill="#0E1626"/>

  <!-- Snowflakes -->
  <circle cx="20" cy="24" r="2.5" fill="#F2F6FC" opacity="0.9"/>
  <circle cx="106" cy="18" r="2" fill="#F2F6FC" opacity="0.7"/>
  <circle cx="112" cy="46" r="2.5" fill="#F2F6FC" opacity="0.8"/>
  <circle cx="16" cy="60" r="1.8" fill="#F2F6FC" opacity="0.6"/>
  <circle cx="30" cy="40" r="1.5" fill="#C9E6FF" opacity="0.7"/>
  <circle cx="98" cy="70" r="1.6" fill="#C9E6FF" opacity="0.6"/>

  <!-- Snow ground -->
  <ellipse cx="64" cy="118" rx="60" ry="10" fill="#F2F6FC" opacity="0.92"/>

  <!-- Trunk -->
  <rect x="57" y="100" width="14" height="12" rx="2" fill="#8B5A2B"/>

  <!-- Tree: three tiers -->
  <polygon points="64,26 40,62 88,62" fill="#2FA35F"/>
  <polygon points="64,42 32,84 96,84" fill="#1F8A4C"/>
  <polygon points="64,60 24,104 104,104" fill="#166B3A"/>

  <!-- Tinsel -->
  <path d="M46 56 Q64 64 80 54" stroke="#FFD15C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M38 78 Q64 88 90 74" stroke="#FFD15C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M30 98 Q64 108 98 94" stroke="#FFD15C" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Ornaments -->
  <circle cx="56" cy="48" r="4" fill="#FF2E43"/>
  <circle cx="74" cy="66" r="4.5" fill="#FF2E43"/>
  <circle cx="48" cy="72" r="4" fill="#8EC9FF"/>
  <circle cx="84" cy="88" r="4.5" fill="#8EC9FF"/>
  <circle cx="58" cy="92" r="5" fill="#FF2E43"/>
  <circle cx="40" cy="96" r="4" fill="#FFD15C"/>
  <circle cx="68" cy="80" r="3.5" fill="#FFD15C"/>

  <!-- Star -->
  <polygon points="64,10 68.2,20.2 79,20.6 70.6,27.2 73.6,37.8 64,31.8 54.4,37.8 57.4,27.2 49,20.6 59.8,20.2" fill="#FFD15C" stroke="#FFE59A" stroke-width="1"/>
</svg>
