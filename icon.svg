<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#0D2A14"/>

  <!-- Shamrock - top leaf -->
  <circle cx="64" cy="42" r="18" fill="#009A44"/>
  <!-- Shamrock - left leaf -->
  <circle cx="46" cy="60" r="18" fill="#009A44"/>
  <!-- Shamrock - right leaf -->
  <circle cx="82" cy="60" r="18" fill="#009A44"/>
  <!-- Shamrock - center overlap -->
  <circle cx="64" cy="56" r="14" fill="#009A44"/>

  <!-- Stem -->
  <rect x="61" y="72" width="6" height="24" rx="3" fill="#009A44"/>
  <!-- Stem curl -->
  <path d="M67 94 Q80 100 75 110" stroke="#009A44" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Orange accent dots -->
  <circle cx="64" cy="42" r="5" fill="#FF8200" opacity="0.7"/>
  <circle cx="46" cy="60" r="5" fill="#FF8200" opacity="0.7"/>
  <circle cx="82" cy="60" r="5" fill="#FF8200" opacity="0.7"/>
</svg>
